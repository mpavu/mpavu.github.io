# Pages CMS configuration — edit the portfolio in your browser at https://app.pagescms.org
# Every field below maps to a key in src/content/site.json.
# Saving in Pages CMS commits to `main`, and GitHub Actions republishes the site in ~1–2 minutes.

media:
  input: public/files
  output: /files

content:
  - name: portfolio
    label: Portfolio
    type: file
    path: src/content/site.json
    format: json
    fields:
      # ---------- Top of the page ----------
      - name: name
        label: Your name
        type: string
        required: true
      - name: title
        label: Job title
        type: string
      - name: tagline
        label: Tagline (small line under your name)
        type: string
      - name: headline
        label: Headline (one sentence)
        type: text
      - name: status
        label: Status badge
        type: string
        description: e.g. "Open to TPM, PM and technical AI roles"
      - name: location
        label: Location
        type: string
      - name: resume
        label: CV file (PDF)
        type: file
        description: Upload a CV WITHOUT your phone number. Leave empty to hide the Download CV button.
      - name: description
        label: Search-engine description
        type: text
      - name: siteUrl
        label: Website address
        type: string
        readonly: true
      - name: social
        label: Contact links
        type: object
        fields:
          - name: email
            label: Email
            type: string
          - name: linkedin
            label: LinkedIn URL
            type: string
          - name: github
            label: GitHub URL
            type: string

      # ---------- Impact numbers ----------
      - name: stats
        label: Impact numbers (blue band)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{value} {label}"
        fields:
          - name: value
            label: Number
            type: string
          - name: label
            label: Label
            type: string

      # ---------- Case studies ----------
      - name: caseStudyHook
        label: Case studies – intro line under the heading
        type: text
      - name: caseStudies
        label: Case studies
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Title
            type: string
          - name: id
            label: Link name (short, no spaces, e.g. ai-x; other sections link to it as #ai-x)
            type: string
          - name: hidden
            label: Hide this case study
            type: boolean
          - name: tag
            label: Category tag
            type: string
          - name: kpis
            label: Headline numbers (shown top right; two work best)
            type: object
            list: true
            fields:
              - name: value
                label: Number or short word
                type: string
              - name: label
                label: What it means
                type: string
          - name: analogy
            label: The analogy (one or two sentences)
            type: text
          - name: visual
            label: Animation next to the analogy
            type: select
            options:
              values: [none, playbook, heartbeat, container, network]
          - name: problem
            label: The friction
            type: text
            description: Wrap words in **double asterisks** to make them bold.
          - name: result
            label: The impact
            type: text
            description: Wrap words in **double asterisks** to make them bold.
          - name: learning
            label: Lesson learned
            type: text
          - name: role
            label: My role (inside "How I built it")
            type: text
          - name: flow
            label: Flow diagram steps (inside "How I built it"; last one is highlighted)
            type: string
            list: true
          - name: action
            label: What I did (inside "How I built it")
            type: text
          - name: skills
            label: Skill chips
            type: string
            list: true
      - name: caseStudyNote
        label: Case studies – footnote (how numbers are estimated)
        type: text

      # ---------- Coinfluence ----------
      - name: featuredProject
        label: Featured project (Coinfluence)
        type: object
        fields:
          - name: tag
            label: Tag
            type: string
          - name: name
            label: Project name
            type: string
          - name: headlineStart
            label: Headline – start
            type: string
          - name: headlineAccent
            label: Headline – underlined italic word
            type: string
          - name: headlineEnd
            label: Headline – end
            type: string
          - name: summary
            label: Summary
            type: text
          - name: stats
            label: Numbers on the card
            type: object
            list: true
            fields:
              - name: value
                label: Number
                type: string
              - name: label
                label: Label
                type: string
          - name: features
            label: Feature bullets
            type: string
            list: true
          - name: decisions
            label: Product decisions
            type: object
            list: true
            fields:
              - name: title
                label: Title
                type: string
              - name: text
                label: Text
                type: text
          - name: stack
            label: Built with
            type: string
            list: true
          - name: note
            label: Privacy note
            type: text
          - name: categories
            label: Categories (leave empty to show only under All)
            type: string
            list: true

      # ---------- Projects ----------
      - name: projectCategories
        label: Project filter buttons (categories)
        type: string
        list: true
        description: Shown as filter buttons above Projects. Tag projects with the same words.
      - name: projects
        label: Projects (cards under the featured project)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Name
            type: string
          - name: description
            label: Description
            type: text
          - name: status
            label: Status badge (optional, e.g. Exploring, Live)
            type: string
          - name: categories
            label: Categories (must match the filter buttons, e.g. AI, ML, IoT)
            type: string
            list: true
          - name: link
            label: Link (web address, or a case study link such as #ai-x)
            type: string
          - name: skills
            label: Skill chips
            type: string
            list: true

      # ---------- About ----------
      - name: aboutMe
        label: About me (one box per paragraph)
        type: text
        list: true
      - name: snapshot
        label: About – facts table
        type: object
        list: true
        fields:
          - name: label
            label: Label
            type: string
          - name: value
            label: Value
            type: string
      - name: principles
        label: How I work (principles)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Title
            type: string
          - name: text
            label: Text
            type: text
          - name: proof
            label: Example link (optional)
            type: object
            fields:
              - name: label
                label: Link text
                type: string
              - name: href
                label: Link target (e.g. #anomaly-detection)
                type: string

      # ---------- Experience & skills ----------
      - name: experience
        label: Experience (newest first)
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{title}"
        fields:
          - name: title
            label: Job title
            type: string
          - name: company
            label: Company · place
            type: string
          - name: dateRange
            label: Dates
            type: string
          - name: bullets
            label: Bullet points
            type: text
            list: true
      - name: skillGroups
        label: Skill groups
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{name}"
        fields:
          - name: name
            label: Group name
            type: string
          - name: items
            label: Skills
            type: string
            list: true
          - name: proof
            label: '"Shown in" links'
            type: object
            list: true
            fields:
              - name: label
                label: Link text
                type: string
              - name: href
                label: Link target (e.g. #wcq)
                type: string

      # ---------- Education & awards ----------
      - name: education
        label: Education
        type: object
        list:
          collapsible:
            collapsed: true
            summary: "{degree}"
        fields:
          - name: degree
            label: Degree
            type: string
          - name: school
            label: School
            type: string
          - name: dateRange
            label: Dates
            type: string
          - name: achievements
            label: Details
            type: string
            list: true
      - name: awards
        label: Awards
        type: object
        list: true
        fields:
          - name: name
            label: Award
            type: string
          - name: org
            label: Given by
            type: string
          - name: year
            label: Year
            type: string

      # ---------- Personal ----------
      - name: beyondWork
        label: Beyond work
        type: object
        fields:
          - name: intro
            label: Intro
            type: text
          - name: photos
            label: Photos (empty image = "coming soon" placeholder; the first one is large)
            type: object
            list: true
            fields:
              - name: image
                label: Photo
                type: image
              - name: caption
                label: Caption
                type: string
              - name: alt
                label: Description for screen readers
                type: string
          - name: currently
            label: Right now
            type: object
            list: true
            fields:
              - name: label
                label: Label (e.g. Learning)
                type: string
              - name: value
                label: Text
                type: string
          - name: languages
            label: Languages I speak
            type: string
          - name: personality
            label: Personality (MBTI)
            type: object
            fields:
              - name: type
                label: Type (e.g. ENFJ-A; empty hides the card)
                type: string
              - name: name
                label: Name
                type: string
              - name: description
                label: One-line description
                type: text
          - name: interests
            label: Interests
            type: object
            list: true
            fields:
              - name: emoji
                label: Emoji
                type: string
              - name: label
                label: Label
                type: string
